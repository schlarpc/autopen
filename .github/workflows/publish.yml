name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    # Only publish from main branch releases
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # Required for npm provenance and OIDC
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate version matches tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Require v prefix and semver format
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error::Tag must be semver with v prefix (e.g., v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          # Extract version without v prefix
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) doesn't match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION validated"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run test:run

      - run: npm run build

      # Uses OIDC trusted publishing - no NPM_TOKEN secret needed
      # Configure at: https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
      - run: npm publish --provenance --access public
